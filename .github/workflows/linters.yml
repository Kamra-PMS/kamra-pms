# Mandatory for Frappe Cloud Marketplace review.
# Mirrors https://github.com/frappe/semgrep-rules#how-to-use-in-my-app
name: Linters

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linter:
    name: Semgrep Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        # ERROR-severity only: Frappe's own tip. WARNING rules (translations,
        # guest whitelist, type hints) are reviewed by hand on the marketplace
        # audit; failing CI on 200+ style warnings would hide a real ERROR.
        run: |
          pip install semgrep
          semgrep --error --severity=ERROR \
            --config ./frappe-semgrep-rules/rules \
            --config r/python.lang.correctness

      - name: Run the rules the marketplace audit also counts
        # The audit reports these two at WARNING severity too, so the step
        # above (ERROR only) never saw them. A real finding needs a
        # same-line `# nosemgrep: <rule> -- reason` on the flagged line.
        run: |
          semgrep --metrics=off --quiet --json \
            --exclude frappe-semgrep-rules \
            --config ./frappe-semgrep-rules/rules/security . > audit.json
          python3 - <<'PY'
          import json
          rules = ("frappe-sql-format-injection", "frappe-security-file-traversal")
          hits = [r for r in json.load(open("audit.json"))["results"]
                  if r["check_id"].rsplit(".", 1)[-1] in rules]
          for r in hits:
              print(f"{r['path']}:{r['start']['line']} {r['check_id'].rsplit('.', 1)[-1]}")
          raise SystemExit(1 if hits else 0)
          PY

  marketplace-install:
    name: Marketplace install simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Offline FC install checks
        run: python kamra/scripts/marketplace_install_check.py
